<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f3a3a">
  <title>Estado de tu reparación</title>
  <style>
    :root {
      --fondo: #f4efe6;
      --tarjeta: #fffdf8;
      --borde: #e6dccb;
      --texto: #1f2a2a;
      --suave: #6b6458;
      --etiqueta: #7a705f;
      --verde-oscuro: #1f3a3a;
      --verde: #2f6f6a;
      --verde-claro: #e3efec;
      --ambar: #b7791f;
      --ambar-claro: #fbf0dc;
      --listo: #2e7d4f;
      --listo-claro: #e2f2e7;
      --sombra: 0 1px 2px rgba(31, 42, 42, .06), 0 8px 24px rgba(31, 42, 42, .06);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
    }
    .cabecera {
      background: var(--verde-oscuro);
      color: #f4efe6;
      border-radius: 22px;
      padding: 22px 22px 24px;
      box-shadow: var(--sombra);
    }
    .cabecera .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #9cc9c1;
      font-weight: 600;
    }
    .cabecera h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .cabecera .negocio {
      margin: 8px 0 0;
      font-size: 16px;
      color: #d8e6e2;
    }
    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 20px;
      margin-top: 14px;
      box-shadow: var(--sombra);
    }
    .etiqueta {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--etiqueta);
      font-weight: 700;
    }
    .estado-actual {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 17px;
    }
    .estado-actual::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }
    .estado-pendiente { background: var(--ambar-claro); color: var(--ambar); }
    .estado-en_reparacion { background: var(--verde-claro); color: var(--verde); }
    .estado-terminada { background: var(--listo-claro); color: var(--listo); }
    .estado-texto { margin: 12px 0 0; color: var(--suave); }
    .pasos {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .paso { text-align: center; font-size: 13px; color: var(--suave); }
    .paso .barra {
      height: 6px;
      border-radius: 999px;
      background: var(--borde);
      margin-bottom: 8px;
    }
    .paso.hecho .barra { background: var(--verde); }
    .paso.actual { color: var(--texto); font-weight: 700; }
    .datos { margin: 0; display: grid; gap: 12px; }
    .datos div { display: grid; gap: 2px; }
    .datos dt { font-size: 13px; color: var(--etiqueta); }
    .datos dd { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
    .montos { display: grid; gap: 10px; }
    .monto {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .monto span { font-size: 15px; color: var(--suave); }
    .monto strong { font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .monto.saldo { border-top: 1px solid var(--borde); padding-top: 12px; margin-top: 2px; }
    .monto.saldo span { color: var(--texto); font-weight: 700; }
    .monto.saldo strong { color: var(--verde-oscuro); font-size: 21px; }
    .pagado { margin: 12px 0 0; color: var(--listo); font-weight: 600; }
    .fotos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .fotos button {
      padding: 0;
      border: 0;
      background: var(--borde);
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      cursor: zoom-in;
    }
    .fotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .acciones { display: grid; gap: 10px; margin-top: 14px; }
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid transparent;
    }
    .boton-whatsapp { background: var(--verde); color: #fff; }
    .boton-llamar { background: var(--tarjeta); color: var(--verde-oscuro); border-color: var(--borde); }
    .boton svg { width: 22px; height: 22px; flex: none; }
    .pie { margin: 18px 4px 0; font-size: 13px; color: var(--suave); text-align: center; }
    .aviso h2 { margin: 0 0 8px; font-size: 20px; }
    .aviso p { margin: 0; color: var(--suave); }
    form.buscar { display: flex; gap: 10px; margin-top: 16px; }
    form.buscar input {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      border: 2px solid var(--borde);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 18px;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: #fff;
      color: var(--texto);
    }
    form.buscar input:focus { outline: none; border-color: var(--verde); }
    form.buscar button {
      min-height: 52px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      background: var(--verde);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }
    .cargando { display: grid; gap: 14px; }
    .esqueleto {
      border-radius: 20px;
      background: linear-gradient(90deg, #ebe3d5 0%, #f6f1e8 50%, #ebe3d5 100%);
      background-size: 200% 100%;
      animation: brillo 1.2s ease-in-out infinite;
    }
    @keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    .visor {
      position: fixed;
      inset: 0;
      background: rgba(10, 16, 16, .92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .visor.abierto { display: flex; }
    .visor img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    .visor button {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      right: 12px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 26px;
      line-height: 1;
    }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .esqueleto { animation: none; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="cargando" id="cargando">
      <div class="esqueleto" style="height:132px"></div>
      <div class="esqueleto" style="height:150px"></div>
      <div class="esqueleto" style="height:190px"></div>
    </div>
  </main>

  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button type="button" id="cerrarVisor" aria-label="Cerrar">×</button>
    <img id="visorImg" alt="">
  </div>

  <script>
    (function () {
      'use strict';

      var SUPABASE_URL = 'https://zzqgjokescjxbluhkxiz.supabase.co';
      var CLAVE_PUBLICA = 'sb_publishable_WP0RToYw647gkXI0G3_Tlg_IAewQS1Z';
      var CODIGO_VALIDO = /^[A-HJKMNP-Z2-9]{10}$/;
      var RUTA_FOTO = /^[A-HJKMNP-Z2-9]{10}\/foto-[0-9a-f-]{36}\.jpg$/;
      var ESTADOS = {
        pendiente: { nombre: 'Recibido', texto: 'Tu equipo ya está en el taller y está esperando su turno para ser revisado.', paso: 1 },
        en_reparacion: { nombre: 'En reparación', texto: 'El técnico está trabajando en tu equipo.', paso: 2 },
        terminada: { nombre: 'Listo para retirar', texto: 'Tu equipo está listo. Podés pasar a retirarlo.', paso: 3 }
      };

      var app = document.getElementById('app');
      var visor = document.getElementById('visor');
      var visorImg = document.getElementById('visorImg');
      var codigoActual = null;
      var ultimaCarga = 0;

      function el(tag, attrs, hijos) {
        var nodo = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            if (k === 'text') nodo.textContent = attrs[k];
            else if (k === 'className') nodo.className = attrs[k];
            else nodo.setAttribute(k, attrs[k]);
          });
        }
        (hijos || []).forEach(function (h) { if (h) nodo.appendChild(h); });
        return nodo;
      }

      function plata(valor) {
        var n = Number(valor);
        if (!isFinite(n)) return '—';
        return '$ ' + n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function fecha(valor) {
        if (!valor) return null;
        var texto = String(valor);
        var d = /^\d{4}-\d{2}-\d{2}$/.test(texto) ? new Date(texto + 'T12:00:00') : new Date(texto);
        if (isNaN(d.getTime())) return null;
        return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      }

      function haceCuanto(valor) {
        var d = new Date(valor);
        if (isNaN(d.getTime())) return null;
        var min = Math.round((Date.now() - d.getTime()) / 60000);
        if (min < 1) return 'recién';
        if (min < 60) return 'hace ' + min + (min === 1 ? ' minuto' : ' minutos');
        var horas = Math.round(min / 60);
        if (horas < 24) return 'hace ' + horas + (horas === 1 ? ' hora' : ' horas');
        return 'el ' + d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) +
          ' a las ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      }

      function numeroWhatsapp(telefono) {
        var d = String(telefono || '').replace(/\D/g, '');
        if (!d) return null;
        if (d.indexOf('549') === 0) return d;
        if (d.indexOf('54') === 0) return '549' + d.slice(2);
        if (d.charAt(0) === '0') d = d.slice(1);
        if (d.length === 10) return '549' + d;
        return null;
      }

      function leerCodigo() {
        var params = new URLSearchParams(location.search);
        var codigo = params.get('c') || location.hash.replace(/^#/, '');
        codigo = String(codigo || '').trim().toUpperCase();
        return CODIGO_VALIDO.test(codigo) ? codigo : null;
      }

      function limpiar() { app.textContent = ''; }

      function cabecera(titulo, subtitulo) {
        return el('header', { className: 'cabecera' }, [
          el('p', { className: 'kicker', text: 'Seguimiento de reparación' }),
          el('h1', { text: titulo }),
          subtitulo ? el('p', { className: 'negocio', text: subtitulo }) : null
        ]);
      }

      function formularioBuscar(valorInicial) {
        var input = el('input', {
          type: 'text', name: 'codigo', inputmode: 'text', autocomplete: 'off', autocapitalize: 'characters',
          spellcheck: 'false', maxlength: '10', placeholder: 'Código de la boleta', 'aria-label': 'Código de la boleta'
        });
        if (valorInicial) input.value = valorInicial;
        var form = el('form', { className: 'buscar' }, [input, el('button', { type: 'submit', text: 'Ver' })]);
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var codigo = input.value.trim().toUpperCase();
          if (!CODIGO_VALIDO.test(codigo)) {
            input.setCustomValidity('Revisá el código: son 10 letras y números.');
            input.reportValidity();
            return;
          }
          input.setCustomValidity('');
          history.replaceState(null, '', '?c=' + codigo);
          iniciar();
        });
        input.addEventListener('input', function () { input.setCustomValidity(''); });
        return form;
      }

      function mostrarInicio() {
        limpiar();
        app.appendChild(cabecera('Estado de tu reparación'));
        app.appendChild(el('section', { className: 'tarjeta aviso' }, [
          el('h2', { text: 'Escaneá el QR de tu boleta' }),
          el('p', { text: 'Con la cámara del celular apuntá al código QR de tu boleta. También podés escribir el código acá.' }),
          formularioBuscar()
        ]));
      }

      function mostrarNoEncontrada(codigo) {
        limpiar();
        app.appendChild(cabecera('No encontramos esta orden'));
        app.appendChild(el('section', { className: 'tarjeta aviso' }, [
          el('h2', { text: 'Revisá el código' }),
          el('p', { text: 'Puede que el código esté mal escrito, o que la orden ya no esté disponible porque se terminó hace más de 90 días. Si tenés dudas, consultá en el taller.' }),
          formularioBuscar(codigo)
        ]));
      }

      function mostrarError() {
        limpiar();
        app.appendChild(cabecera('No pudimos cargar tu orden'));
        var reintentar = el('button', { type: 'button', className: 'boton boton-llamar', text: 'Intentar de nuevo' });
        reintentar.style.width = '100%';
        reintentar.style.marginTop = '16px';
        reintentar.addEventListener('click', iniciar);
        app.appendChild(el('section', { className: 'tarjeta aviso' }, [
          el('h2', { text: 'Problema de conexión' }),
          el('p', { text: 'Revisá que tengas internet y volvé a intentar en un momento.' }),
          reintentar
        ]));
      }

      function iconoWhatsapp() {
        var ns = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        var p = document.createElementNS(ns, 'path');
        p.setAttribute('fill', 'currentColor');
        p.setAttribute('d', 'M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z');
        svg.appendChild(p);
        return svg;
      }

      function abrirVisor(src) {
        visorImg.src = src;
        visor.classList.add('abierto');
        document.getElementById('cerrarVisor').focus();
      }

      function cerrarVisor() {
        visor.classList.remove('abierto');
        visorImg.removeAttribute('src');
      }

      function mostrarReparacion(r, codigo) {
        limpiar();
        var estado = ESTADOS[r.estado] || ESTADOS.pendiente;
        var orden = String(r.numero_orden || '').trim();
        document.title = 'Orden ' + orden + ' · ' + estado.nombre;

        app.appendChild(cabecera('Orden N° ' + orden, r.negocio || ''));

        var pasos = el('ol', { className: 'pasos', 'aria-label': 'Avance de la reparación' },
          ['Recibido', 'En reparación', 'Listo'].map(function (nombre, i) {
            var n = i + 1;
            var clase = 'paso' + (n <= estado.paso ? ' hecho' : '') + (n === estado.paso ? ' actual' : '');
            var li = el('li', { className: clase }, [el('div', { className: 'barra' }), document.createTextNode(nombre)]);
            if (n === estado.paso) li.setAttribute('aria-current', 'step');
            return li;
          }));

        app.appendChild(el('section', { className: 'tarjeta' }, [
          el('p', { className: 'etiqueta', text: 'Estado' }),
          el('span', { className: 'estado-actual estado-' + (ESTADOS[r.estado] ? r.estado : 'pendiente'), text: estado.nombre }),
          el('p', { className: 'estado-texto', text: estado.texto }),
          pasos
        ]));

        var datos = [];
        if (r.equipo) datos.push(['Equipo', r.equipo]);
        if (fecha(r.fecha_ingreso)) datos.push(['Ingresó', fecha(r.fecha_ingreso)]);
        if (r.estado === 'terminada' && fecha(r.fecha_terminada)) datos.push(['Terminado', fecha(r.fecha_terminada)]);
        if (datos.length) {
          app.appendChild(el('section', { className: 'tarjeta' }, [
            el('p', { className: 'etiqueta', text: 'Tu equipo' }),
            el('dl', { className: 'datos' }, datos.map(function (d) {
              return el('div', null, [el('dt', { text: d[0] }), el('dd', { text: d[1] })]);
            }))
          ]));
        }

        var total = Number(r.total) || 0;
        if (total > 0) {
          var saldo = Number(r.saldo);
          var montos = el('div', { className: 'montos' }, [
            el('div', { className: 'monto' }, [el('span', { text: 'Total' }), el('strong', { text: plata(total) })]),
            el('div', { className: 'monto' }, [el('span', { text: 'Seña' }), el('strong', { text: plata(r.sena || 0) })]),
            el('div', { className: 'monto saldo' }, [el('span', { text: 'Saldo a pagar' }), el('strong', { text: plata(isFinite(saldo) ? Math.max(saldo, 0) : 0) })])
          ]);
          var hijos = [el('p', { className: 'etiqueta', text: 'Pago' }), montos];
          if (isFinite(saldo) && saldo <= 0) hijos.push(el('p', { className: 'pagado', text: 'Está todo pagado.' }));
          app.appendChild(el('section', { className: 'tarjeta' }, hijos));
        }

        var fotos = (Array.isArray(r.fotos) ? r.fotos : []).filter(function (ruta) { return RUTA_FOTO.test(ruta); });
        if (fotos.length) {
          var grilla = el('div', { className: 'fotos' }, fotos.map(function (ruta, i) {
            var src = SUPABASE_URL + '/storage/v1/object/public/fotos/' + ruta;
            var img = el('img', { src: src, alt: 'Foto ' + (i + 1) + ' de tu equipo', loading: 'lazy', decoding: 'async' });
            var boton = el('button', { type: 'button', 'aria-label': 'Ampliar foto ' + (i + 1) }, [img]);
            boton.addEventListener('click', function () { abrirVisor(src); });
            return boton;
          }));
          app.appendChild(el('section', { className: 'tarjeta' }, [
            el('p', { className: 'etiqueta', text: 'Fotos de tu equipo' }),
            grilla
          ]));
        }

        var acciones = el('div', { className: 'acciones' });
        var wa = numeroWhatsapp(r.telefono);
        if (wa) {
          var mensaje = 'Hola, te consulto por la orden N° ' + orden + '.';
          var enlace = el('a', {
            className: 'boton boton-whatsapp',
            href: 'https://wa.me/' + wa + '?text=' + encodeURIComponent(mensaje),
            target: '_blank', rel: 'noopener'
          }, [iconoWhatsapp(), document.createTextNode('Consultar por WhatsApp')]);
          acciones.appendChild(enlace);
        }
        if (acciones.childNodes.length) app.appendChild(acciones);

        var actualizado = haceCuanto(r.actualizado_en);
        app.appendChild(el('p', { className: 'pie', text: actualizado ? 'Actualizado ' + actualizado + '.' : '' }));
      }

      function cargar(codigo, silencioso) {
        if (!silencioso) {
          limpiar();
          var cargando = el('div', { className: 'cargando' }, [
            el('div', { className: 'esqueleto', style: 'height:132px' }),
            el('div', { className: 'esqueleto', style: 'height:150px' }),
            el('div', { className: 'esqueleto', style: 'height:190px' })
          ]);
          app.appendChild(cargando);
        }
        return fetch(SUPABASE_URL + '/rest/v1/rpc/estado_reparacion', {
          method: 'POST',
          headers: { 'apikey': CLAVE_PUBLICA, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_codigo: codigo }),
          cache: 'no-store'
        })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (datos) {
            ultimaCarga = Date.now();
            if (!datos) mostrarNoEncontrada(codigo);
            else mostrarReparacion(datos, codigo);
          })
          .catch(function () {
            if (!silencioso) mostrarError();
          });
      }

      function iniciar() {
        codigoActual = leerCodigo();
        if (!codigoActual) { mostrarInicio(); return; }
        cargar(codigoActual, false);
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && codigoActual && Date.now() - ultimaCarga > 30000) {
          cargar(codigoActual, true);
        }
      });
      visor.addEventListener('click', function (e) { if (e.target !== visorImg) cerrarVisor(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarVisor(); });

      iniciar();
    })();
  </script>
</body>
</html>
